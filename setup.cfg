[metadata]
name = gnirsDataManager
#version = attr: src.VERSION
version = 0.1
description = GNIRS Data Manager

[options]
install_requires =
    asyncinotify
    caproto
    gnirsdc-tools
package_dir =
    = src
packages = find:

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    gnirsdm = gnirsDataManager.gnirsdm:entry_point
