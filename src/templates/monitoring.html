{% extends "base.html" %}
{% block title %}System Monitoring{% endblock %}
{% block content %}
<div id="monitoring" class="tabcontent">
    <h1>System Monitoring</h1>
    
    <div class="heartbeat-container">
        <span class="heartbeat-label">GNIRS DC Health:</span>
        <div id="heartbeatIndicator" class="heartbeat-indicator"></div>
    </div>
    
    <div class="status-container">
        <span class="status-label">GNIRS DC Status:</span>
        <span id="applyCValueIndicator"></span>
    </div>
    
    <div class="top-name-container">
        <span class="top-name-label">Epics Top:</span>
        <span id="topNameValue"></span>
    </div>
    
    <div class="temperature-container">
        <span class="temperature-label">Temperature:</span>
        <span id="temperatureValue"></span>
    </div>
    
    <div class="interlock-container">
        <span class="interlock-label">Temperature Interlock:</span>
        <div id="interlockIndicator" class="interlock-indicator"></div>
    </div>
    
    <button id="initializeSDSUBtn" class="btn btn-secondary">Initialize SDSU</button>
    <button id="startIntegrationBtn" class="btn btn-primary">Start Integration</button>
    <button id="clearErrorsBtn" class="btn btn-warning">Clear Errors</button>
    
    <h2>Integration Parameters</h2>
    <form id="integrationParamsForm">
        <div class="form-grid">
            <label for="fowlerNum">Fowler Number:</label>
            <input type="number" id="fowlerNum" name="fowler_num" value="{{ fowler_num }}" class="form-control">
            
            <label for="digitalAvgs">Digital Averages:</label>
            <input type="number" id="digitalAvgs" name="digital_avgs" value="{{ digital_avgs }}" class="form-control">
            
            <label for="integTime">Exposure Time (s):</label>
            <input type="number" id="integTime" name="integ_time" value="{{ integ_time }}" step="0.1" class="form-control">
            
            <label for="fileName">File Name:</label>
            <input type="text" id="fileName" name="file_name" value="{{ file_name }}" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">Set Parameters</button>
    </form>
    
    <div>
        <h2>Logs</h2>
        <ul class="nav nav-tabs" id="logTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="pv-log-tab" data-bs-toggle="tab" data-bs-target="#pv-log" type="button" role="tab" aria-controls="pv-log" aria-selected="true">PV Log</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="file-log-tab" data-bs-toggle="tab" data-bs-target="#file-log" type="button" role="tab" aria-controls="file-log" aria-selected="false">File Log</button>
            </li>
        </ul>
        <div class="tab-content" id="logTabsContent">
            <div class="tab-pane fade show active" id="pv-log" role="tabpanel" aria-labelledby="pv-log-tab">
                <textarea id="logMessages" rows="20" cols="100" readonly></textarea>
            </div>
            <div class="tab-pane fade" id="file-log" role="tabpanel" aria-labelledby="file-log-tab">
                <textarea id="fileLogMessages" rows="20" cols="100" readonly></textarea>
            </div>
        </div>
    </div>
    <div id="connectionStatus"></div>
</div>

<style>
    .form-grid {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 1rem;
        align-items: center;
        margin-bottom: 1rem;
        max-width: 500px;
    }
    .form-grid label {
        text-align: right;
        padding-right: 0.5rem;
        font-weight: bold;
    }
    .form-control {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    #startIntegrationBtn {
        margin-bottom: 1rem;
    }
    .heartbeat-container {
        display: flex;
        align-items: center;
        margin-bottom: 1rem;
    }
    .heartbeat-label {
        font-weight: bold;
        margin-right: 0.5rem;
    }
    .heartbeat-indicator {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: inline-block;
        border: 1px solid #ccc;
        box-sizing: border-box;
    }
    .heartbeat-on {
        background-color: green;
        border-color: green;
    }
    .heartbeat-off {
        background-color: white;
    }
    .nav-tabs {
        display: flex;
        list-style-type: none;
        padding: 0;
        margin: 0;
        border-bottom: 1px solid #dee2e6;
    }
    .nav-item {
        margin-bottom: -1px;
    }
    .nav-tabs .nav-link {
        display: block;
        padding: 0.5rem 1rem;
        border: 1px solid transparent;
        border-top-left-radius: 0.25rem;
        border-top-right-radius: 0.25rem;
        text-decoration: none;
        color: #495057;
    }
    .nav-tabs .nav-link:hover, .nav-tabs .nav-link:focus {
        border-color: #e9ecef #e9ecef #dee2e6;
        isolation: isolate;
    }
    .nav-tabs .nav-link.active {
        color: #495057;
        background-color: #fff;
        border-color: #dee2e6 #dee2e6 #fff;
    }
    .tab-content > .tab-pane {
        display: none;
    }
    .tab-content > .active {
        display: block;
    }
    .status-container,
    .top-name-container,
    .temperature-container,
    .interlock-container {
        margin-bottom: 1rem;
    }
    .status-label,
    .top-name-label,
    .temperature-label,
    .interlock-label {
        font-weight: bold;
        margin-right: 0.5rem;
    }
    #applyCValueIndicator {
        font-weight: normal;
    }
    .interlock-indicator {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: inline-block;
        border: 1px solid #ccc;
        box-sizing: border-box;
    }
    .interlock-on {
        background-color: green;
        border-color: green;
    }
    .interlock-off {
        background-color: red;
        border-color: red;
    }
    
    #logMessages, #fileLogMessages {
        width: 900px;  /* Set default width to 900px */
        max-width: 100%;  /* Ensure it doesn't exceed the container width */
        resize: horizontal;  /* Allow horizontal resizing */
        overflow: auto;  /* Add scrollbars when content exceeds the textarea size */
    }
    
    /* Adjust the container to accommodate the wider textareas */
    .tab-content {
        overflow-x: auto;  /* Add horizontal scrolling if needed */
        max-width: 100%;   /* Ensure it doesn't overflow the parent container */
    }
</style>

<script>
    const logMessagesTextarea = document.getElementById('logMessages');
    const connectionStatus = document.getElementById('connectionStatus');
    const heartbeatIndicator = document.getElementById('heartbeatIndicator');
    const fowlerNumInput = document.getElementById('fowlerNum');
    const digitalAvgsInput = document.getElementById('digitalAvgs');
    const integTimeInput = document.getElementById('integTime');
    const fileNameInput = document.getElementById('fileName');
    const fileLogMessagesTextarea = document.getElementById('fileLogMessages');
    const topNameValue = document.getElementById('topNameValue');
    const temperatureValue = document.getElementById('temperatureValue');
    const interlockIndicator = document.getElementById('interlockIndicator');

    let previousPVs = {};
    let userEditing = false;

    function updateLogMessages(messages) {
        let logText = '';
        let lastStatus = 'unknown';
        messages.forEach(function(entry) {
            logText += `${entry.value}\n`;  // Remove ${entry.timestamp} -
            lastStatus = entry.status;
        });
        logMessagesTextarea.value = logText;
        logMessagesTextarea.scrollTop = logMessagesTextarea.scrollHeight;
        
        if (lastStatus === "connected") {
            connectionStatus.textContent = "Connected";
            connectionStatus.style.color = 'green';
        } else if (lastStatus === "disconnected") {
            connectionStatus.textContent = "Disconnected";
            connectionStatus.style.color = 'red';
        } else {
            connectionStatus.textContent = "Error";
            connectionStatus.style.color = 'orange';
        }
    }

    function updateFileLog() {
        fetch('/get_file_log')
            .then(response => response.text())
            .then(data => {
                fileLogMessagesTextarea.value = data;
                fileLogMessagesTextarea.scrollTop = fileLogMessagesTextarea.scrollHeight;
            })
            .catch(error => console.error('Error fetching file log:', error));
    }

    function updateAllPVs() {
        fetch('/get_all_pvs')
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    const pvs = data.pvs;
                    
                    // Update top name
                    topNameValue.textContent = pvs.top_name || 'N/A';

                    // Update heartbeat indicator
                    if (pvs.heartbeat === 1) {
                        heartbeatIndicator.classList.add('heartbeat-on');
                        heartbeatIndicator.classList.remove('heartbeat-off');
                    } else {
                        heartbeatIndicator.classList.add('heartbeat-off');
                        heartbeatIndicator.classList.remove('heartbeat-on');
                    }

                    // Update temperature
                    temperatureValue.textContent = pvs.temperature ? `${pvs.temperature.toFixed(2)} K` : 'N/A';

                    // Update interlock override indicator
                    if (pvs.interlock_override === 0) {
                        interlockIndicator.classList.add('interlock-on');
                        interlockIndicator.classList.remove('interlock-off');
                        interlockIndicator.title = 'Temperature Interlock: ON';
                    } else {
                        interlockIndicator.classList.add('interlock-off');
                        interlockIndicator.classList.remove('interlock-on');
                        interlockIndicator.title = 'Temperature Interlock: OFF';
                    }

                    // Update Apply C Value indicator
                    let applyCValue = pvs.apply_c_value;
                    const applyCValueIndicator = document.getElementById('applyCValueIndicator');
                    
                    // Convert number to string if necessary
                    if (typeof applyCValue === 'number') {
                        switch (applyCValue) {
                            case 0: applyCValue = 'IDLE'; break;
                            case 1: applyCValue = 'BUSY'; break;
                            case 2: applyCValue = 'PAUSED'; break;
                            case 3: applyCValue = 'ERR'; break;
                            default: applyCValue = `UNKNOWN (${applyCValue})`;
                        }
                    }

                    applyCValueIndicator.textContent = applyCValue;

                    switch (applyCValue) {
                        case 'IDLE':
                            applyCValueIndicator.style.color = 'green';
                            break;
                        case 'BUSY':
                        case 'PAUSED':
                            applyCValueIndicator.style.color = 'orange';
                            break;
                        case 'ERR':
                        default:
                            applyCValueIndicator.style.color = 'red';
                    }

                    // Update form inputs only if values have changed and user is not editing
                    if (!userEditing) {
                        if (pvs.fowler_num !== previousPVs.fowler_num) {
                            fowlerNumInput.value = pvs.fowler_num;
                        }
                        if (pvs.digital_avgs !== previousPVs.digital_avgs) {
                            digitalAvgsInput.value = pvs.digital_avgs;
                        }
                        if (pvs.integ_time !== previousPVs.integ_time) {
                            integTimeInput.value = pvs.integ_time;
                        }
                        if (pvs.file_name !== previousPVs.file_name) {
                            fileNameInput.value = pvs.file_name;
                        }
                    }

                    // Update previous PV values
                    previousPVs = {...pvs};
                } else {
                    console.error('Error fetching PVs:', data.message);
                }
            })
            .catch(error => {
                console.error('Error fetching PVs:', error);
            });
    }

    // Initial load of log messages
    fetch('/get_log_messages')
        .then(response => response.json())
        .then(data => updateLogMessages(data))
        .catch(error => console.error('Error fetching initial log messages:', error));

    // Initial load of file log
    updateFileLog();

    // Update file log every 5 seconds
    setInterval(updateFileLog, 500);

    // Set up SSE for real-time updates
    const eventSource = new EventSource('/sse');
    eventSource.onmessage = function(event) {
        const messages = JSON.parse(event.data);
        updateLogMessages(messages);
    };
    eventSource.onerror = function(error) {
        console.error('SSE Error:', error);
        connectionStatus.textContent = "Connection Error";
        connectionStatus.style.color = 'red';
    };

    // Add event listener for the Start Integration button
    document.getElementById('startIntegrationBtn').addEventListener('click', function() {
        fetch('/start_integration', {method: 'POST'})
            .then(response => response.json())
            .then(data => {
                if (data.status !== 'success') {
                    console.error('Error:', data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
    });

    // Add event listener for the Clear Errors button
    document.getElementById('clearErrorsBtn').addEventListener('click', function() {
        fetch('/clear_errors', {method: 'POST'})
            .then(response => response.json())
            .then(data => {
                if (data.status !== 'success') {
                    console.error('Error:', data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
    });

    // Updated event listener for the integration parameters form
    document.getElementById('integrationParamsForm').addEventListener('submit', function(e) {
        e.preventDefault();
        fetch('/set_integration_params', {
            method: 'POST',
            body: new FormData(this),
        })
        .then(response => response.json())
        .then(data => {
            if (data.status !== 'success') {
                console.error('Error:', data.message);
            }
        })
        .catch(error => {
            console.error('Error:', error);
        });
    });

    // Add event listener for the Initialize SDSU button
    document.getElementById('initializeSDSUBtn').addEventListener('click', function() {
        fetch('/initialize_sdsu', {method: 'POST'})
            .then(response => response.json())
            .then(data => {
                if (data.status !== 'success') {
                    console.error('Error:', data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
    });

    // Update all PVs every 100ms
    setInterval(updateAllPVs, 100);

    // Add event listeners to track when user is editing
    [fowlerNumInput, digitalAvgsInput, integTimeInput, fileNameInput].forEach(input => {
        input.addEventListener('focus', () => userEditing = true);
        input.addEventListener('blur', () => {
            userEditing = false;
            updateAllPVs(); // Update immediately when user finishes editing
        });
    });

    // Add tab functionality
    document.querySelectorAll('.nav-link').forEach(tab => {
        tab.addEventListener('click', (e) => {
            e.preventDefault();
            document.querySelectorAll('.nav-link').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('show', 'active'));
            tab.classList.add('active');
            document.querySelector(tab.getAttribute('data-bs-target')).classList.add('show', 'active');
        });
    });
</script>
{% endblock %}
