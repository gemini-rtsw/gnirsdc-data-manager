{% extends "base.html" %}
{% block content %}
<h1 class="mb-4">Engineering Controls</h1>

<div class="row">
    <div class="col-md-6 mb-4">
        <div class="card h-100">
            <div class="card-header bg-primary text-white">
                <h5 class="card-title mb-0">Temperature Interlock</h5>
            </div>
            <div class="card-body">
                <p>Current status: <span id="interlock-status" class="badge bg-{{ 'warning' if interlock_status else 'success' }}">{{ "Disabled" if interlock_status else "Enabled" }}</span></p>
                <button id="toggle-interlock" class="btn btn-warning">Toggle Interlock Override</button>
            </div>
        </div>
    </div>

    <div class="col-md-6 mb-4">
        <div class="card h-100">
            <div class="card-header bg-info text-white">
                <h5 class="card-title mb-0">Disk Space Information</h5>
            </div>
            <div class="card-body">
                <div id="disk-space-info"></div>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-6 mb-4">
        <div class="card h-100">
            <div class="card-header bg-success text-white">
                <h5 class="card-title mb-0">Directory Sizes</h5>
            </div>
            <div class="card-body">
                <div id="directory-sizes"></div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('toggle-interlock').addEventListener('click', function() {
    fetch('/toggle_interlock', {method: 'POST'})
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                const statusElement = document.getElementById('interlock-status');
                statusElement.textContent = data.new_interlock_status ? 'Disabled' : 'Enabled';
                statusElement.className = `badge bg-${data.new_interlock_status ? 'warning' : 'success'}`;
            } else {
                alert('Error: ' + data.message);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('An error occurred while toggling the interlock.');
        });
});

function updateEngInfo() {
    fetch('/get_eng_info')
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                // Handle disk space info
                let diskSpaceHtml = '';
                if (data.disk_space && Object.keys(data.disk_space).length > 0) {
                    diskSpaceHtml = '<div class="table-responsive"><table class="table table-sm table-striped">';
                    diskSpaceHtml += '<thead><tr><th>Mountpoint</th><th>Device</th><th>Usage</th></tr></thead><tbody>';
                    for (const [mountpoint, info] of Object.entries(data.disk_space)) {
                        const percentUsed = typeof info.percent_used === 'number' ? info.percent_used.toFixed(2) : 'N/A';
                        diskSpaceHtml += `
                            <tr>
                                <td>${mountpoint}</td>
                                <td>${info.device}</td>
                                <td>${info.used}GB / ${info.total}GB (${percentUsed}% used)</td>
                            </tr>`;
                    }
                    diskSpaceHtml += '</tbody></table></div>';
                } else {
                    diskSpaceHtml = '<p>No disk space information available.</p>';
                }
                document.getElementById('disk-space-info').innerHTML = diskSpaceHtml;

                // Handle directory sizes
                let dirSizesHtml = '';
                if (data.dir_sizes && Object.keys(data.dir_sizes).length > 0) {
                    dirSizesHtml = '<ul class="list-group">';
                    for (const [dir, size] of Object.entries(data.dir_sizes)) {
                        dirSizesHtml += `<li class="list-group-item d-flex justify-content-between align-items-center">
                            ${dir}
                            <span class="badge bg-primary rounded-pill">${size}</span>
                        </li>`;
                    }
                    dirSizesHtml += '</ul>';
                } else {
                    dirSizesHtml = '<p>No directory size information available.</p>';
                }
                document.getElementById('directory-sizes').innerHTML = dirSizesHtml;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('disk-space-info').innerHTML = '<p>Error fetching disk space information.</p>';
            document.getElementById('directory-sizes').innerHTML = '<p>Error fetching directory size information.</p>';
        });
}

// Update engineering info every 1 seconds
updateEngInfo();
setInterval(updateEngInfo, 1000);
</script>
<style>
    #disk-space-info table {
        font-size: 14px;
    }
    #disk-space-info th,
    #disk-space-info td {
        padding: 0.3rem;
    }
</style>
{% endblock %}
