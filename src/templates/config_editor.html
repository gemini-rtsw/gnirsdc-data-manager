{% extends "base.html" %}
{% block title %}Config Editor{% endblock %}
{% block content %}
<div id="config-editor" class="tabcontent">
    <h1>Config Editor</h1>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 2px 4px;
            text-align: left;
            border: none;
        }
        th {
            background-color: #e0e0e0;
            color: #333;
            font-weight: bold;
            border-bottom: 1px solid #ddd;
        }
        td:first-child {
            width: 30%;
            padding-right: 10px;
        }
        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
        }
    </style>
    <form action="{{ url_for('save') }}" method="post">
        {% for section, items in sections.items() %}
            <h2>{{ section }}</h2>
            <table>
                <tr>
                    <th>Key</th>
                    <th>Value</th>
                </tr>
                {% for key, value in items.items() %}
                <tr>
                    <td><label for="{{ section }}_{{ key }}">{{ key }}</label></td>
                    <td><input type="text" id="{{ section }}_{{ key }}" name="{{ section }}_{{ key }}" value="{{ value }}"></td>
                </tr>
                {% endfor %}
            </table>
        {% endfor %}
        <br>
        <input type="submit" value="Save">
    </form>
    <p><a href="{{ url_for('monitoring') }}">Monitoring</a></p>
</div>
{% endblock %}
