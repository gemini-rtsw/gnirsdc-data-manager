<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}System Manager{% endblock %}</title>
    <style>
        .tab {
            overflow: hidden;
            border: 1px solid #ccc;
            background-color: #f1f1f1;
        }
        .tab button {
            background-color: inherit;
            float: left;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 14px 16px;
            transition: 0.3s;
        }
        .tab button:hover {
            background-color: #ddd;
        }
        .tab button.active {
            background-color: #ccc;
        }
        .tabcontent {
            display: block;
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-top: none;
        }
    </style>
</head>
<body>
    <div class="tab">
        <button class="tablinks {% if active_tab == 'config' %}active{% endif %}" onclick="location.href='{{ url_for('index') }}'">Config Editor</button>
        <button class="tablinks {% if active_tab == 'monitoring' %}active{% endif %}" onclick="location.href='{{ url_for('monitoring') }}'">Monitoring</button>
    </div>

    {% block content %}{% endblock %}

</body>
</html>
