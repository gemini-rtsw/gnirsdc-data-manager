<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}System Manager{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .tab {
            overflow: hidden;
            border: 1px solid #ccc;
            background-color: #f1f1f1;
        }
        .tab button {
            background-color: inherit;
            float: left;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 14px 16px;
            transition: 0.3s;
        }
        .tab button:hover {
            background-color: #ddd;
        }
        .tab button.active {
            background-color: #ccc;
        }
        .tabcontent {
            display: block;
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-top: none;
        }
    </style>
</head>
<body>
    <div class="tab">
        <button class="tablinks {% if active_tab == 'monitoring' %}active{% endif %}" onclick="location.href='{{ url_for('monitoring') }}'">Monitoring</button>
        <button class="tablinks {% if active_tab == 'fits' %}active{% endif %}" onclick="location.href='{{ url_for('fits_files') }}'">FITS Files</button>
        <button class="tablinks {% if active_tab == 'preview' %}active{% endif %}" onclick="location.href='{{ url_for('preview') }}'">Preview Latest</button>
        <button class="tablinks {% if active_tab == 'config' %}active{% endif %}" onclick="location.href='{{ url_for('config_page') }}'">Config Editor</button>
        <button class="tablinks {% if active_tab == 'logs' %}active{% endif %}" onclick="location.href='{{ url_for('logs') }}'">Logs</button>
        <button class="tablinks {% if active_tab == 'engineering' %}active{% endif %}" onclick="location.href='{{ url_for('engineering') }}'">Engineering</button>
        <button class="tablinks {% if active_tab == 'readme' %}active{% endif %}" onclick="location.href='{{ url_for('readme') }}'">Help</button>
    </div>

    {% block content %}{% endblock %}

</body>
</html>
