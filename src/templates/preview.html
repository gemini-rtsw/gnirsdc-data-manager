{% extends "base.html" %}
{% block content %}
<h1>Preview Latest FITS File</h1>

<div class="preview-container">
    <div class="image-row">
        <div class="image-box">
            <h3>FITS Preview</h3>
            <img id="preview-image" alt="Latest FITS file preview">
        </div>
        <div class="image-box">
            <h3>Noise Rejection Map</h3>
            <img id="noise-image" alt="Noise rejection map">
        </div>
    </div>

    <p id="debug-info" class="debug-info"></p>

    <div class="info-panel">
        <table class="info-table">
            <tr>
                <th>Filename:</th>
                <td id="info-filename">Loading...</td>
            </tr>
            <tr>
                <th>Full Path:</th>
                <td id="info-path">Loading...</td>
            </tr>
            <tr>
                <th>Write Time:</th>
                <td id="info-time">Loading...</td>
            </tr>
            <tr>
                <th>LNR:</th>
                <td id="info-lnr">Loading...</td>
            </tr>
            <tr>
                <th>ADCS:</th>
                <td id="info-adcs">Loading...</td>
            </tr>
            <tr>
                <th>Coadds:</th>
                <td id="info-coadds">Loading...</td>
            </tr>
        </table>
    </div>
</div>

<style>
    .preview-container {
        max-width: 1800px;
        margin: 0 auto;
    }
    .image-row {
        display: flex;
        gap: 20px;
        align-items: flex-start;
    }
    .image-box {
        flex: 1;
        text-align: center;
        background-color: #f0f0f0;
        border-radius: 8px;
        padding: 10px;
    }
    .image-box h3 {
        margin: 0 0 10px 0;
        font-size: 1em;
        color: #333;
    }
    .image-box img {
        max-width: 100%;
        height: auto;
        border-radius: 4px;
    }
    .info-panel {
        background-color: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        padding: 15px;
        margin-top: 20px;
    }
    .info-table {
        width: 100%;
        border-collapse: collapse;
    }
    .info-table th {
        text-align: left;
        padding: 8px 12px;
        background-color: #6c757d;
        color: white;
        width: 120px;
        font-weight: normal;
    }
    .info-table td {
        padding: 8px 12px;
        font-family: monospace;
        background-color: white;
        word-break: break-all;
    }
    .info-table tr {
        border-bottom: 1px solid #dee2e6;
    }
    .debug-info {
        text-align: center;
        color: #666;
        font-size: 0.9em;
        margin-top: 10px;
    }
</style>

<script>
    console.log("Script loaded");

    let lastKnownFilename = null;
    let lastModifiedTime = 0;

    function updatePreview() {
        const debugInfo = document.getElementById('debug-info');
        const currentImage = document.getElementById('preview-image');
        const noiseImage = document.getElementById('noise-image');

        // Update both image sources with a cache-busting timestamp
        const ts = new Date().getTime();
        currentImage.src = "{{ url_for('preview_latest_fits') }}?" + ts;
        noiseImage.src = "{{ url_for('preview_noise_map') }}?" + ts;

        // Update file info
        fetch("{{ url_for('preview_latest_fits') }}?info=true")
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    document.getElementById('info-filename').textContent = data.filename || 'N/A';
                    document.getElementById('info-path').textContent = data.full_path || 'N/A';
                    document.getElementById('info-time').textContent = data.write_time || 'N/A';
                    document.getElementById('info-lnr').textContent = data.lnr || 'N/A';
                    document.getElementById('info-adcs').textContent = data.adcs || 'N/A';
                    document.getElementById('info-coadds').textContent = data.coadds || 'N/A';
                    debugInfo.textContent = "Last refresh: " + new Date().toLocaleTimeString();
                } else {
                    document.getElementById('info-filename').textContent = 'No file available';
                    document.getElementById('info-path').textContent = '-';
                    document.getElementById('info-time').textContent = '-';
                    document.getElementById('info-lnr').textContent = '-';
                    document.getElementById('info-adcs').textContent = '-';
                    document.getElementById('info-coadds').textContent = '-';
                }
            })
            .catch(error => {
                console.error("Error fetching file info:", error);
                document.getElementById('info-filename').textContent = 'Error loading info';
            });
    }

    // Initial update
    updatePreview();

    // Update every 0.5 seconds
    setInterval(updatePreview, 500);
    console.log("Refresh interval set");
</script>
{% endblock %}
