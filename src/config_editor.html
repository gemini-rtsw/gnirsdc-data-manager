<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Config Editor</title>
</head>
<body>
    <h1>Config Editor</h1>
    <form action="{{ url_for('save') }}" method="post">
        {% for section in config.sections() %}
            <h2>{{ section }}</h2>
            {% for key in config[section] %}
                <label for="{{ section }}_{{ key }}">{{ key }}:</label>
                <input type="text" id="{{ section }}_{{ key }}" name="{{ section }}_{{ key }}" value="{{ config[section][key] }}"><br>
            {% endfor %}
        {% endfor %}
        <input type="submit" value="Save">
    </form>
</body>
</html>
