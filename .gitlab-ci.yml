stages:
  - build
  - push

variables:
  CONTAINER_NAME: "gnirsdc-run"
  DOCKERFILE_NAME: "Dockerfile.linux_run"

stages:
  - build
  - push

variables:
  CONTAINER_NAME: "gnirsdc-run"
  DOCKERFILE_NAME: "Dockerfile.linux_run"
  DEPLOY_TOKEN: "***REMOVED***"

before_script:
  - echo "Logging into GitLab Container Registry with deploy token..."
  - echo $DEPLOY_TOKEN | docker login $CI_REGISTRY -u $DEPLOY_TOKEN --password-stdin

build_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t $CI_REGISTRY_IMAGE/$CI_PROJECT_PATH/$CONTAINER_NAME:$CI_COMMIT_REF_SLUG -f $DOCKERFILE_NAME .

push_to_registry:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker push $CI_REGISTRY_IMAGE/$CI_PROJECT_PATH/$CONTAINER_NAME:$CI_COMMIT_REF_SLUG
  only:
    - master
