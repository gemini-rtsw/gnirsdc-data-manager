stages:
  - build
  - pages

# Note: 'REGISTRY_TOKEN' is used here for operations requiring authentication
# (registry login, cloning the sibling IOC repos). It is a GROUP-level CI/CD
# variable ("Gemini CI Access") inherited from the parent group, so it is shared
# across the rtsw projects and is not defined per-project.
#
# If it expires or needs rotating:
# 1. Navigate to the GitLab rtsw group's settings.
# 2. Go to 'Access Tokens' under the 'Settings' menu.
# 3. Create a new Personal Access Token with the appropriate scopes.
#    will need: read repo, read api, rw registry
# 4. Copy the newly generated token.
# 5. In the GROUP's settings under 'CI / CD', go to 'Variables'.
# 6. Update the 'REGISTRY_TOKEN' variable with the new token as the value.
#    Ensure to mark it as 'Protected off' and 'Masked' as necessary.
#    Rotating it at the group level affects every project that inherits it.

variables:
  CONTAINER_NAME: "gnirsdc"
  DOCKERFILE_RUN: "Dockerfile.run"
  DOCKERFILE_ENV: "Dockerfile.dev"

build_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "Logging into GitLab Container Registry with registry token..."
    - echo $REGISTRY_TOKEN | docker login $CI_REGISTRY -u oauth2 --password-stdin
  script:
    - git clone -b master https://oauth2:$REGISTRY_TOKEN@gitlab.com/nsf-noirlab/gemini/rtsw/iocs/gnirsdc-data-manager.git gnirsdc
    - git clone -b main https://oauth2:$REGISTRY_TOKEN@gitlab.com/nsf-noirlab/gemini/rtsw/iocs/pycadcar.git pycadcar
    - git clone -b master https://oauth2:$REGISTRY_TOKEN@gitlab.com/nsf-noirlab/gemini/rtsw/iocs/gnirsdc-tools.git gnirsdc-tools
    - git clone -b master https://oauth2:$REGISTRY_TOKEN@gitlab.com/nsf-noirlab/gemini/rtsw/iocs/gnirsdc-lib.git gnirsdc-lib
    # Build and push dev image
    - |
      docker build --build-arg REGISTRY_TOKEN=$REGISTRY_TOKEN \
                   --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
                   --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
                   -t $CI_REGISTRY_IMAGE/${CONTAINER_NAME}-dev:latest \
                   -t $CI_REGISTRY_IMAGE/${CONTAINER_NAME}-dev:$CI_COMMIT_SHORT_SHA \
                   -f $DOCKERFILE_ENV .
    - docker push $CI_REGISTRY_IMAGE/${CONTAINER_NAME}-dev:latest
    - docker push $CI_REGISTRY_IMAGE/${CONTAINER_NAME}-dev:$CI_COMMIT_SHORT_SHA
    
    # Build and push run image
    - |
      docker build --build-arg REGISTRY_TOKEN=$REGISTRY_TOKEN \
                   --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
                   --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
                   -t $CI_REGISTRY_IMAGE/${CONTAINER_NAME}-run:latest \
                   -t $CI_REGISTRY_IMAGE/${CONTAINER_NAME}-run:$CI_COMMIT_SHORT_SHA \
                   -f $DOCKERFILE_RUN .
    - docker push $CI_REGISTRY_IMAGE/${CONTAINER_NAME}-run:latest
    - docker push $CI_REGISTRY_IMAGE/${CONTAINER_NAME}-run:$CI_COMMIT_SHORT_SHA
    
    # Build and push gmp-server image
    - |
      docker build --build-arg REGISTRY_TOKEN=$REGISTRY_TOKEN \
                   --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
                   --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
                   -f Dockerfile.gmp \
                   -t registry.gitlab.com/nsf-noirlab/gemini/rtsw/iocs/gnirsdc-data-manager/gmp-server:latest \
                   -t registry.gitlab.com/nsf-noirlab/gemini/rtsw/iocs/gnirsdc-data-manager/gmp-server:$CI_COMMIT_SHORT_SHA .
    - docker push registry.gitlab.com/nsf-noirlab/gemini/rtsw/iocs/gnirsdc-data-manager/gmp-server:latest
    - docker push registry.gitlab.com/nsf-noirlab/gemini/rtsw/iocs/gnirsdc-data-manager/gmp-server:$CI_COMMIT_SHORT_SHA
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $ONLY_PAGES != "true"'

pages:
  stage: pages
  image: docker:latest
  services:
    - docker:dind
  script:
    # Build and run the documentation builder in one step
    - docker build -t docs-builder -f Dockerfile.docs .
    - docker run --rm -v $(pwd):/docs docs-builder
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'