stages:
  - build
  - push

variables:
  CONTAINER_NAME: "gnirsdc-run"
  DOCKERFILE_NAME: "Dockerfile.linux_run"

build_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t $CI_REGISTRY_IMAGE/$CI_PROJECT_PATH/$CONTAINER_NAME:$CI_COMMIT_REF_SLUG -f $DOCKERFILE_NAME .

push_to_registry:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE/$CI_PROJECT_PATH/$CONTAINER_NAME:$CI_COMMIT_REF_SLUG
  only:
    - master

