stages:
  - build
  - pages

# Note: The 'DEPLOY_TOKEN' is used here for operations requiring authentication.
# If 'DEPLOY_TOKEN' expires or you need to create a new one, follow these steps:
# 1. Navigate to your GitLab rtsw group's settings.
# 2. Go to 'Access Tokens' under the 'Settings' menu.
# 3. Create a new Personal Access Token with the appropriate scopes. 
#    will need: read repo, read api, rw registry
# 4. Copy the newly generated token.
# 5. In your project's settings under 'CI / CD', go to 'Variables'.
# 6. Add a new variable with the key 'DEPLOY_TOKEN' and paste the token as the value.
#    Ensure to mark it as 'Protected off' and 'Masked' as necessary.


variables:
  CONTAINER_NAME: "gnirsdc"
  DOCKERFILE_RUN: "Dockerfile.run"
  DOCKERFILE_ENV: "Dockerfile.dev"

      
build_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "Logging into GitLab Container Registry with deploy token..."
    - echo $DEPLOY_TOKEN | docker login $CI_REGISTRY -u $DEPLOY_TOKEN --password-stdin
  script:
    - git clone -b master             https://oauth2:$DEPLOY_TOKEN@gitlab.com/nsf-noirlab/gemini/rtsw/iocs/gnirsdc-data-manager.git  gnirsdc
    - git clone -b main               https://oauth2:$DEPLOY_TOKEN@gitlab.com/nsf-noirlab/gemini/rtsw/iocs/pycadcar.git              pycadcar
    - git clone -b master             https://oauth2:$DEPLOY_TOKEN@gitlab.com/nsf-noirlab/gemini/rtsw/iocs/gnirsdc-tools.git         gnirsdc-tools
    - git clone -b master             https://oauth2:$DEPLOY_TOKEN@gitlab.com/nsf-noirlab/gemini/rtsw/iocs/gnirsdc-lib.git           gnirsdc-lib
    # Build and push dev image
    - docker build --build-arg DEPLOY_TOKEN=$DEPLOY_TOKEN 
                   --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
                   --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
                   -t $CI_REGISTRY_IMAGE/${CONTAINER_NAME}-dev:latest
                   -t $CI_REGISTRY_IMAGE/${CONTAINER_NAME}-dev:$CI_COMMIT_SHORT_SHA
                   -f $DOCKERFILE_ENV .
    - docker push $CI_REGISTRY_IMAGE/${CONTAINER_NAME}-dev:latest
    - docker push $CI_REGISTRY_IMAGE/${CONTAINER_NAME}-dev:$CI_COMMIT_SHORT_SHA
    
    # Build and push run image
    - docker build --build-arg DEPLOY_TOKEN=$DEPLOY_TOKEN 
                   --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
                   --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
                   -t $CI_REGISTRY_IMAGE/${CONTAINER_NAME}-run:latest
                   -t $CI_REGISTRY_IMAGE/${CONTAINER_NAME}-run:$CI_COMMIT_SHORT_SHA
                   -f $DOCKERFILE_RUN .
    - docker push $CI_REGISTRY_IMAGE/${CONTAINER_NAME}-run:latest
    - docker push $CI_REGISTRY_IMAGE/${CONTAINER_NAME}-run:$CI_COMMIT_SHORT_SHA
    
    # Build and push gmp-server image
    - docker build --build-arg DEPLOY_TOKEN=$DEPLOY_TOKEN 
                   --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
                   --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
                   -f Dockerfile.gmp 
                   -t registry.gitlab.com/nsf-noirlab/gemini/rtsw/iocs/gnirsdc-data-manager/gmp-server:latest
                   -t registry.gitlab.com/nsf-noirlab/gemini/rtsw/iocs/gnirsdc-data-manager/gmp-server:$CI_COMMIT_SHORT_SHA .
    - docker push registry.gitlab.com/nsf-noirlab/gemini/rtsw/iocs/gnirsdc-data-manager/gmp-server:latest
    - docker push registry.gitlab.com/nsf-noirlab/gemini/rtsw/iocs/gnirsdc-data-manager/gmp-server:$CI_COMMIT_SHORT_SHA
    
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $ONLY_PAGES != "true"'

pages:
  stage: pages
  image: alpine:latest
  script:
    - apk add --no-cache pandoc nodejs npm python3
    - npm install -g @mermaid-js/mermaid-cli
    - mkdir -p public
    # Extract and convert Mermaid diagrams to SVG
    - mkdir -p diagrams
    - grep -A 10 '```mermaid' README.md | sed -n '/```mermaid/,/```/p' | sed 's/```mermaid//;s/```//' > diagrams/diagram.mmd
    - npx -p @mermaid-js/mermaid-cli mmdc -i diagrams/diagram.mmd -o diagrams/diagram.svg
    # Convert markdown to HTML, replacing Mermaid code blocks with SVG images
    - sed 's/```mermaid.*```/![Mermaid Diagram](diagrams\/diagram.svg)/' README.md > README.processed.md
    - pandoc README.processed.md -f markdown+raw_html -t html5 --toc --toc-depth=3 --highlight-style pygments --number-sections --template=src/templates/template.html --metadata title="Detector Controller Software" -o public/index.html
    - cp diagrams/diagram.svg public/
  artifacts:
    paths:
      - public
  only:
    - master